<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本機知識筆記</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>筆記</span>
        <span id="sidebar-actions">
          <button id="btn-new-folder" title="新增資料夾"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h4l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/><path d="M12 11v6M9 14h6"/></svg></button>
          <button id="btn-new-note" title="新增筆記"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg></button>
        </span>
      </div>
      <div id="tree-root"></div>
    </aside>
    <main id="editor-pane">
      <div id="editor-empty">請從左側選擇一篇筆記，或使用上方按鈕新增</div>
      <div id="editor-content" hidden>
        <div id="editor-toolbar">
          <h1 id="note-title" contenteditable="true" spellcheck="false"></h1>
          <span id="editor-toolbar-actions">
            <button id="btn-toggle-source" title="切換為原始 Markdown 檢視/編輯"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4"/><path d="M15 8l4 4-4 4"/></svg><span class="btn-label">檢視原始碼</span></button>
            <button id="btn-copy-source" title="複製本篇筆記的 Markdown 原始碼"><svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span class="btn-label">複製原始碼</span></button>
          </span>
        </div>
        <div id="save-status"></div>
        <div id="block-editor"></div>
        <textarea id="source-editor" hidden spellcheck="false"></textarea>
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/markdown.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tree.js') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
